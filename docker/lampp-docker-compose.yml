version: '3.8'

services:
  web:
    image: php:7.4-apache
    container_name: apache
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
    networks:
      - mynetwork

  db:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mynetwork

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8081:80"
    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  db_data:
